[project]
name = "netforec"
version = "0.1.0"
description = "AI-powered network attack forecasting from network traffic (SIH26153)"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn==1.9.1",  # pinned to match the version netforc_scaler.pkl was saved with
    "joblib>=1.3",
    "torch>=2.0",
]

[project.scripts]
netforec = "netforec.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["netforec*"]

[tool.setuptools.package-data]
netforec = ["model_artifacts/*"]
